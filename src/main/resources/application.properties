spring.application.name=course-enrollment-testing

# 이 기기(127.0.0.1)에서만 접속을 받는다. 포트는 --server.port 또는 SERVER_PORT로 바꿀 수 있다.
server.address=127.0.0.1
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# 메모리 DB: 서버를 다시 시작하면 초기화된다.
spring.datasource.url=jdbc:h2:mem:enrollment;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# 실습 시계. FIXED(기본): lab.fixed-at에 멈춘 시계, SYSTEM: 실제 현재 시각
lab.clock-mode=FIXED
lab.fixed-at=2026-11-20T10:00:00+09:00

# OpenAPI 문서와 Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.paths-to-match=/api/**
springdoc.default-produces-media-type=application/json
# ControllerAdvice의 공통 오류 응답을 모든 operation에 끼워 넣지 않는다(각 operation에 직접 적었다).
springdoc.override-with-generic-response=false
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
